name: v0.7.2-P1 audit static verify

on:
  push:
    branches:
      - feat/v0.7.2-p1-parking-coverage-audit

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Existing v0.7.1 local verify
        run: npm run verify:live
      - name: Audit script syntax check
        run: node --check scripts/audit-parking-realtime-coverage.mjs
      - name: Audit safety guard check
        shell: bash
        run: |
          set +e
          node scripts/audit-parking-realtime-coverage.mjs > guard.log 2>&1
          code=$?
          cat guard.log
          if [ "$code" -ne 2 ]; then
            echo "Expected guard exit 2, got $code"
            exit 1
          fi
          grep -q "명시적 확인" guard.log
