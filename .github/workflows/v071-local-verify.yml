name: v0.7.1 local verify

on:
  push:
    branches:
      - fix/v0.7.1-live-stabilization-clean
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-live-local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: LIVE local verify
        run: npm run verify:live
