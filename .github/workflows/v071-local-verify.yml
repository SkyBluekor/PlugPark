name: v0.7.1 local verify

on:
  push:
    branches:
      - fix/v0.7.1-live-stabilization-clean
      - feat/v0.7.2-p1-parking-coverage-audit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-live-local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: LIVE local verify
        run: npm run verify:live

      - name: v0.7.2-P1 audit syntax
        run: node --check scripts/audit-parking-realtime-coverage.mjs

      - name: v0.7.2-P1 audit safety guard
        shell: bash
        run: |
          set +e
          node scripts/audit-parking-realtime-coverage.mjs > guard.log 2>&1
          code=$?
          cat guard.log
          test "$code" -eq 2
          grep -q "명시적 확인" guard.log
