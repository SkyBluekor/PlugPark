name: v0.7.2-P2 one-shot release

on:
  push:
    branches:
      - feat/v0.7.2-p2-parking-match-stabilization

permissions:
  contents: read

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release-v072-p2]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUSAN_PARKING_API_KEY: ${{ secrets.BUSAN_PARKING_API_KEY }}
      PLUGPARK_INGEST_TOKEN: ${{ secrets.INGEST_ADMIN_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
      CI: "1"

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Required release credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 20; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 21; }
          test -n "$BUSAN_PARKING_API_KEY" || { echo "Missing BUSAN_PARKING_API_KEY"; exit 22; }
          echo "Required release credentials: PRESENT"
          if [ -n "${PLUGPARK_INGEST_TOKEN:-}" ]; then
            echo "Optional INGEST_ADMIN_TOKEN: PRESENT"
          else
            echo "Optional INGEST_ADMIN_TOKEN: ABSENT · release will verify scheduled Cron instead"
          fi

      - name: Parking v2 contract probe
        run: npm run probe:parking-api

      - name: Execute guarded v0.7.2-P2 release
        run: npm run release:v072-p2

      - name: Upload release receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v072-p2-release-receipts-${{ github.run_id }}
          path: |
            .plugpark/v072-p2-preflight-result.json
            .plugpark/v072-p2-release-result.json
            .plugpark/live-local-verify-result.json
            .plugpark/parking-match-v072-verify-result.json
            .plugpark/parking-api-probe.json
          if-no-files-found: ignore
          retention-days: 14
