name = "plugpark"
main = "worker/index.ts"
compatibility_date = "2026-09-21"

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
MATCH_RADIUS_METERS = "200"
BUSAN_REALTIME_PARKING_API_URL = "https://apis.data.go.kr/B552587/ParkingInfoService_v2"

[[d1_databases]]
binding = "DB"
database_name = "plugpark-db"
database_id = "4c75a008-14a4-4ff7-9f94-c601a686f0aa"

# Live data refresh is demand-driven from /api/places.
# Explicitly deploy an empty cron list so Wrangler removes any previously attached Cron Trigger.
[triggers]
crons = []
